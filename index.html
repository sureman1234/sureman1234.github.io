<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的主页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system, sans-serif;}
body{background:#000;color:#fff;min-height:100vh;padding:60px 20px;display:flex;flex-direction:column;align-items:center;}
.avatar{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#ffac5c,#3b68ff);margin-bottom:20px;display:flex;align-items:center;justify-content:center;font-size:36px;}
h1{font-size:28px;margin-bottom:8px;font-weight:600;}
.bio{color:#888;margin-bottom:50px;font-size:15px;}
.links{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px;}
a{
    display:flex;align-items:center;justify-content:space-between;
    color:#fff;text-decoration:none;font-size:17px;
    padding:18px 24px;border:1px solid #1e293b;border-radius:14px;
    background:rgba(255,255,255,0.03);transition:all .2s;
}
a:hover{background:rgba(255,255,255,0.08);border-color:#475569;transform:translateY(-2px);}
.arrow{color:#64748b;}
</style>
</head>
<body>
    <div class="avatar">🌌</div>
    <h1>sureman1234</h1>
    <p class="bio">个人主页</p>
    <div class="links">
        <a href="./galaxy.html">银河系可视化 <span class="arrow">→</span></a>
    </div>
</body>
</html>
